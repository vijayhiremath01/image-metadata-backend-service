name : Deply NodeJS app to AWS EC2
on : 
  push:
    branches: 
      - main 

jobs : 
   deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name : Deploy to AWS EC2
          uses : applebot/ssh-action@v1.0.3
          with :
            host : ${{ secrets.SSH_HOST }}
            username : root 
            key : ${{ secrets.SSH_KEY }}
            script : |
              cd /home/ubuntu/ratelimiting-ci-cd-backend-app
              git pull 
              docker compose up -d --build 